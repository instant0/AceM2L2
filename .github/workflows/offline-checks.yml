name: offline-checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Lua and XML tools
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luajit libxml2-utils

      - name: Build release zip
        run: python3 tests/build_release.py

      - name: Run offline checks
        env:
          LUA_BIN: lua5.1
          LUAC_BIN: luac5.1
          STRICT_ROOT: "1"
          CHECK_RELEASE: "1"
        run: ./tests/run_all.sh
